<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{header}} - Pegasus Pages</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand" hx-get="/" hx-target="#content" hx-push-url="true">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.5 0 3-.3 4.3-.9"/>
          <path d="M13 5.5c2.5-.5 5.5.5 7.5 3.5 1.5 2.2 1.8 4.8 1 7"/>
          <path d="M12 2c1 2 1.5 4.5 1 7-.5 2.5-2 4.5-4 6"/>
          <path d="M21.5 9c-1 1.5-3 2.5-5 2.8-2 .3-4-.2-5.5-1.3"/>
        </svg>
        <span>Pegasus</span>
      </a>
      <ul class="nav-links">
        <li><a href="/" hx-get="/" hx-target="#content" hx-push-url="true">Home</a></li>
        <li><a href="/about" hx-get="/about" hx-target="#content" hx-push-url="true">About</a></li>
        <li><a href="/contact" hx-get="/contact" hx-target="#content" hx-push-url="true">Contact</a></li>
      </ul>
    </div>
  </nav>
  <main id="content">
    {{slot}}
  </main>
  <footer class="footer">
    <p>Pegasus Pages &middot; Built with Delphi</p>
  </footer>
</body>
</html>
